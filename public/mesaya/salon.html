<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel del salón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="mesaya.css">
<style>
/* Layout: tablet/escritorio — cola de solicitudes a la izquierda (lo urgente), mesas y resumen a la derecha */
.wrap{max-width:1200px;margin:0 auto;padding-block:calc(14px + env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{font-size:24px}
.top .r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.box h2{font-size:18px;display:flex;align-items:center;gap:8px}
.count{background:var(--alert);color:#fff;border-radius:999px;font-family:var(--body);font-size:13px;padding:2px 9px}
.req{border:1px solid var(--line);border-left:5px solid var(--mango);border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.req.bill{border-left-color:var(--alert)}
.req.redeem{border-left-color:var(--brand)}
.req.order{border-left-color:var(--ok)}
.req.ready{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.items{display:grid;gap:4px;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14.5px}
.items .it{display:flex;justify-content:space-between;gap:10px}
.items .q{font-weight:800;min-width:28px;display:inline-block}
.items .nt{display:block;font-size:12.5px;color:var(--alert);font-weight:600;margin-left:28px}
.tbl.order{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.req.fresh{animation:flash 1.2s ease-out 2}
@keyframes flash{50%{background:color-mix(in srgb,var(--mango) 25%,var(--surface))}}
.req .h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.req .mesa{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;min-width:52px}
.req .mesa small{display:block;font-family:var(--body);font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.req .what{font-weight:700;font-size:16px}
.req .det{font-size:13.5px;color:var(--muted)}
.req .tags{display:flex;gap:6px;flex-wrap:wrap}
.req .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.amt{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);flex:1;min-width:150px;max-width:220px}
.amt span{padding:0 10px;font-weight:700;color:var(--muted)}
.amt input{border:0;border-radius:0;padding:10px 10px 10px 0;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.amt input:focus{outline:none}
.amt:focus-within{outline:2px solid var(--brand)}
.empty{color:var(--muted);text-align:center;padding:26px 14px;border:1px dashed var(--line);border-radius:14px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.tbl{border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-height:62px}
.tbl b{font-family:var(--display);font-size:20px;display:block;line-height:1.1}
.tbl span{font-size:11.5px;color:var(--muted)}
.tbl.call{border-color:var(--mango);background:color-mix(in srgb,var(--mango) 16%,var(--surface))}
.tbl.bill{border-color:var(--alert);background:color-mix(in srgb,var(--alert) 12%,var(--surface))}
.tbl.redeem{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kpi b{font-family:var(--display);font-size:20px;display:block}
.kpi span{font-size:12px;color:var(--muted)}
.log{display:grid;gap:6px;font-size:13px;max-height:240px;overflow-y:auto}
.log div{display:flex;gap:8px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.login{max-width:380px;margin:12vh auto 0;display:grid;gap:14px}
.login h1{font-size:30px}
.demo-tip{font-size:13px;border:1px dashed var(--mango);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.demo-tip a{color:var(--brand);font-weight:700}
.err{color:var(--alert);margin:0;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
(function(){
const C = window.MESAYA, R = C.restaurant, RULES = C.rules;
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const fmt = n => "₡" + Math.round(n || 0).toLocaleString("es-CR");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? "ahora" : m < 60 ? "hace " + m + " min" : "hace " + Math.floor(m / 60) + " h"; };
const hm = t => new Date(t).toLocaleTimeString("es-CR", { hour: "numeric", minute: "2-digit" });
function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2400); }

let started = false, list = [], known = null, unsub = null, sound = false, audio = null, drafts = {}, fresh = new Set();
const TKEY = "mesaya_salon_today_" + R.id + "_" + Store.dayKey();
let today = (() => { try { return JSON.parse(localStorage.getItem(TKEY)) || { cobros: 0, total: 0, pts: 0, calls: 0, log: [] }; } catch (e) { return { cobros: 0, total: 0, pts: 0, calls: 0, log: [] }; } })();
const saveToday = () => { try { localStorage.setItem(TKEY, JSON.stringify(today)); } catch (e) {} };
const log = t => { today.log.unshift({ at: Date.now(), t }); today.log = today.log.slice(0, 80); saveToday(); };

/* ---------- acceso ---------- */
function showLogin(err){
  const demo = Store.mode() === "demo";
  $("#app").innerHTML = `<form class="login" id="lf">
    <span class="eyebrow">${esc(R.name)}</span><h1>Panel del salón</h1>
    ${demo ? "" : `<label class="f">Correo<input id="le" type="email" autocomplete="username" required></label>`}
    <label class="f">${demo ? "PIN" : "Contraseña"}<input id="lp" type="password" ${demo ? 'inputmode="numeric"' : ""} autocomplete="current-password" required></label>
    ${err ? `<p class="err">${esc(err)}</p>` : ""}
    <button class="btn brand block" type="submit">Entrar</button>
    ${demo ? `<div class="demo-tip"><b>Modo demo</b><span>PIN del salón: ${esc(C.demoStaffPin)}</span><span>Abre el menú de la mesa 7 en otra pestaña de este navegador: <a href="index.html?m=7&k=${Store.tableKey(7)}" target="_blank" rel="noopener">abrir Mesa 7</a></span><span>Pantalla de cocina (mismo PIN): <a href="cocina.html" target="_blank" rel="noopener">abrir cocina</a></span></div>` : ""}
  </form>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    try { await Store.login("staff", demo ? "" : $("#le").value.trim(), $("#lp").value); start(); }
    catch (x) { showLogin(x.message && x.message.includes("auth/") ? "Correo o contraseña incorrectos" : (x.message || "No se pudo entrar")); }
  };
  setTimeout(() => { const i = $("#le") || $("#lp"); if (i) i.focus(); }, 50);
}

/* ---------- sonido ---------- */
function beep(){
  if (!sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175].forEach((f, i) => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = f; o.connect(g); g.connect(audio.destination);
      const t = audio.currentTime + i * 0.18; g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3); o.start(t); o.stop(t + 0.32); });
  } catch (e) {}
}

/* ---------- panel ---------- */
function start(){
  if (started) return; started = true;
  $("#app").innerHTML = `
  <div class="top"><div><span class="eyebrow">${esc(R.name)}</span><h1>Panel del salón</h1></div>
    <div class="r"><span class="chip ${Store.mode() === "demo" ? "mango" : "ok"}" id="conn">${Store.mode() === "demo" ? "Modo demo" : "En vivo"}</span>
      <a class="btn line sm" href="cocina.html" target="_blank" rel="noopener">Pantalla de cocina</a><button class="btn line sm" id="snd">Activar sonido</button><button class="btn ghost sm" id="out">Salir</button></div></div>
  <div class="grid">
    <section class="box" aria-label="Solicitudes"><h2>Solicitudes <span class="count" id="cnt" hidden></span></h2><div id="queue" style="display:grid;gap:10px"></div></section>
    <div style="display:grid;gap:18px;min-width:0">
      <section class="box"><h2>Mesas</h2><div class="tables" id="tables"></div></section>
      <section class="box"><h2>Hoy en este dispositivo</h2><div class="kpis" id="kpis"></div><div class="log" id="log"></div></section>
    </div>
  </div>`;
  $("#snd").onclick = () => { sound = !sound; $("#snd").textContent = sound ? "Sonido activado" : "Activar sonido"; $("#snd").className = "btn sm " + (sound ? "brand" : "line"); if (sound) beep(); };
  $("#out").onclick = async () => { if (unsub) unsub(); unsub = null; started = false; known = null; await Store.logout(); showLogin(); };
  renderSide();
  if (unsub) unsub();
  unsub = Store.watchActive((l, err) => {
    if (err) { $("#conn").textContent = "Sin conexión"; $("#conn").className = "chip alert"; $("#queue").innerHTML = `<div class="empty">No se pudo leer las solicitudes. Revisa la conexión y que este correo tenga acceso en las reglas de Firestore.</div>`; return; }
    $("#conn").textContent = Store.mode() === "demo" ? "Modo demo" : "En vivo"; $("#conn").className = "chip " + (Store.mode() === "demo" ? "mango" : "ok");
    const ids = new Set(l.map(r => r.id + ":" + r.status));
    if (known) { let ping = false; l.forEach(r => { const k = r.id + ":" + r.status; if (!known.has(k) && (r.status === "pending" || r.status === "reported_paid" || r.status === "ready")) { fresh.add(r.id); ping = true; } }); if (ping) beep(); }
    known = ids; list = l; renderQueue(); renderSide();
  });
}
const LABEL = { call: "Llama al mesero", bill: "Pide la cuenta", redeem: "Canje de puntos", order: "Pedido nuevo" };
const METHOD = { sinpe: "SINPE Móvil", tarjeta: "Tarjeta", efectivo: "Efectivo" };
function presenceChip(p){
  if (!p) return `<span class="chip warn">Sin ubicación</span>`;
  if (p.simulated) return `<span class="chip mango">Ubicación simulada</span>`;
  if (p.state === "in") return `<span class="chip ok">En el local</span>`;
  return `<span class="chip warn">${p.state === "out" ? "Fuera del local" : "Sin ubicación"}</span>`;
}
function card(r){
  let what = LABEL[r.type], det = "", acts = "";
  const cust = r.customer ? `<span class="chip">${esc(r.customer.name)}${r.type === "redeem" ? " · " + r.customer.points + " pts" : ""}</span>` : "";
  if (r.type === "call") { det = r.about ? "Sobre: " + esc(r.about) : "Necesita atención"; acts = `<button class="btn brand" data-a="done" data-id="${r.id}">Voy en camino</button>`; }
  if (r.type === "bill") {
    det = METHOD[r.method] + (r.bonus ? ` · +${r.bonus} pts de juegos` : "");
    if (r.status === "pending") {
      what = "Pide la cuenta · " + METHOD[r.method];
      if (drafts[r.id] == null && r.ordersTotal) drafts[r.id] = String(r.ordersTotal);
      if (r.ordersTotal) det += ` · pedidos por la app: ${fmt(r.ordersTotal)}`;
      acts = `<label class="amt"><span>₡</span><input id="amt-${r.id}" inputmode="numeric" placeholder="Total" aria-label="Total de la mesa ${r.mesa}" value="${esc(drafts[r.id] || "")}"></label>
        <button class="btn main" data-a="send" data-id="${r.id}">${r.method === "sinpe" ? "Enviar total al cliente" : "Enviar total y voy"}</button>`;
    } else if (r.status === "amount_sent") {
      what = r.method === "sinpe" ? "Esperando el SINPE" : "Cobrar en la mesa"; det = METHOD[r.method] + " · " + fmt(r.amount) + (r.rejected ? " · se le avisó que no entró" : "");
      acts = r.method === "sinpe" ? `<button class="btn ghost sm" data-a="edit" data-id="${r.id}">Corregir total</button>` : `<button class="btn brand" data-a="confirm" data-id="${r.id}">Cobrado ${fmt(r.amount)}</button><button class="btn ghost sm" data-a="edit" data-id="${r.id}">Corregir total</button>`;
    } else if (r.status === "reported_paid") {
      what = "Verificar SINPE"; det = `<b style="color:var(--fg)">${fmt(r.amount)}</b> · referencia <b style="color:var(--fg)">${esc(r.ref)}</b> · revisa la app del banco`;
      acts = `<button class="btn brand" data-a="confirm" data-id="${r.id}">Sí entró, confirmar</button><button class="btn danger" data-a="reject" data-id="${r.id}">No entró</button>`;
    }
  }
  if (r.type === "order") {
    const n = r.items.reduce((a, i) => a + i.qty, 0);
    what = "Pedido nuevo · " + n + (n === 1 ? " plato" : " platos"); det = fmt(r.total) + (r.note ? ` · <b style="color:var(--fg)">Nota: ${esc(r.note)}</b>` : "");
    det += `</div><div class="items" style="margin-top:8px">${r.items.map(i => `<div class="it"><span><span class="q">${i.qty}×</span>${esc(i.name)}${i.note ? `<span class="nt">${esc(i.note)}</span>` : ""}</span><span class="num muted">${fmt(i.price * i.qty)}</span></div>`).join("")}`;
    acts = `<button class="btn brand" data-a="accept" data-id="${r.id}">Aceptar y enviar a cocina</button><button class="btn danger sm" data-a="decline" data-id="${r.id}">No se puede</button>`;
    if (r.status === "ready") { what = "Pedido listo en cocina · llevar a la mesa"; acts = `<button class="btn brand" data-a="delivered" data-id="${r.id}">Entregado en la mesa</button>`; }
  }
  if (r.type === "redeem") { det = esc(r.reward.name) + " · " + r.reward.pts + " pts"; acts = `<button class="btn brand" data-a="redeem" data-id="${r.id}">Entregado, descontar puntos</button><button class="btn ghost" data-a="deny" data-id="${r.id}">Rechazar</button>`; }
  return `<article class="req ${r.type}${r.status === "ready" ? " ready" : ""}${fresh.has(r.id) ? " fresh" : ""}">
    <div class="h"><div class="mesa"><small>Mesa</small>${r.mesa}</div><div style="flex:1;min-width:0"><div class="what">${what}</div><div class="det">${det}</div></div><span class="muted num" style="font-size:12.5px">${ago(r.createdAt)}</span></div>
    <div class="tags">${presenceChip(r.presence)}${cust}</div>
    <div class="acts">${acts}</div></article>`;
}
function renderQueue(){
  const ae = document.activeElement, focusId = ae && ae.id && ae.id.startsWith("amt-") ? ae.id : null, sel = focusId ? [ae.selectionStart, ae.selectionEnd] : null;
  const n = list.filter(r => r.status === "pending" || r.status === "reported_paid" || r.status === "ready").length;
  $("#cnt").hidden = !n; $("#cnt").textContent = n; document.title = (n ? "(" + n + ") " : "") + "Panel del salón";
  $("#queue").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">Sin solicitudes. Cuando una mesa llame al mesero o pida la cuenta, aparece aquí${sound ? " con sonido" : ""}.</div>`;
  fresh.clear();
  $$("input[id^=amt-]").forEach(i => { i.oninput = () => { drafts[i.id.slice(4)] = i.value.replace(/[^\d]/g, ""); }; i.onkeydown = e => { if (e.key === "Enter") { const b = $(`[data-a=send][data-id="${i.id.slice(4)}"]`); if (b) b.click(); } }; });
  if (focusId && $("#" + focusId)) { const i = $("#" + focusId); i.focus(); try { i.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
  $$("[data-a]").forEach(b => b.onclick = () => act(b.dataset.id, b.dataset.a, b));
}
async function act(id, a, btn){
  const r = list.find(x => x.id === id); if (!r) return;
  btn.disabled = true;
  try {
    if (a === "done") { await Store.updateRequest(id, { status: "done", doneAt: Date.now() }); Store.recordEvent("calls").catch(() => {}); today.calls++; log(`Mesa ${r.mesa}: mesero en camino`); }
    if (a === "send") {
      const amount = parseInt((drafts[id] || ($("#amt-" + id) || {}).value || "").replace(/\D/g, ""), 10);
      if (!amount || amount < 100) { toast("Escribe el total de la mesa"); btn.disabled = false; const i = $("#amt-" + id); if (i) i.focus(); return; }
      await Store.updateRequest(id, { status: "amount_sent", amount, rejected: false }); delete drafts[id]; log(`Mesa ${r.mesa}: total ${fmt(amount)} enviado (${METHOD[r.method]})`);
    }
    if (a === "edit") { await Store.updateRequest(id, { status: "pending" }); drafts[id] = String(r.amount || ""); }
    if (a === "reject") { await Store.updateRequest(id, { status: "amount_sent", rejected: true }); log(`Mesa ${r.mesa}: SINPE ${r.ref} no encontrado`); }
    if (a === "confirm") {
      const pts = r.customer ? Math.floor(r.amount / RULES.colonesPerPoint) + (r.bonus || 0) : 0;
      if (r.customer && pts) await Store.addPoints(r.customer.phone, pts, { type: "visit", date: Date.now(), amount: r.amount, pts, mesa: r.mesa });
      await Store.updateRequest(id, { status: "confirmed", pointsAwarded: pts, confirmedAt: Date.now() });
      Store.recordSale({ at: Date.now(), amount: r.amount, method: r.method, mesa: r.mesa, points: pts, customer: !!r.customer, views: r.views || {} }).catch(e => console.error(e));
      today.cobros++; today.total += r.amount; today.pts += pts; log(`Mesa ${r.mesa}: cobrado ${fmt(r.amount)} (${METHOD[r.method]})${pts ? " · +" + pts + " pts a " + r.customer.name : ""}`);
      toast("Pago confirmado · mesa " + r.mesa);
    }
    if (a === "redeem") {
      await Store.addPoints(r.customer.phone, -r.reward.pts, { type: "redeem", date: Date.now(), reward: r.reward.name, pts: -r.reward.pts });
      await Store.updateRequest(id, { status: "done", doneAt: Date.now() }); Store.recordEvent("redeems").catch(() => {});
      log(`Mesa ${r.mesa}: canje ${r.reward.name} (${r.customer.name})`);
    }
    if (a === "accept") {
      await Store.updateRequest(id, { status: "kitchen", kitchen: "new", acceptedAt: Date.now() });
      Store.recordOrder(r.items).catch(e => console.error(e));
      log(`Mesa ${r.mesa}: pedido a cocina (${r.items.map(i => i.qty + "× " + i.name).join(", ")})`);
    }
    if (a === "delivered") { await Store.updateRequest(id, { status: "done", doneAt: Date.now() }); log(`Mesa ${r.mesa}: pedido entregado`); }
    if (a === "decline") {
      if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = "¿Rechazar? Toca de nuevo"; btn.disabled = false; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.sure; btn.textContent = "No se puede"; } }, 3000); return; }
      await Store.updateRequest(id, { status: "cancelled", reason: "El salón no pudo tomar este pedido (puede haber algo agotado). Tu mesero se acerca." });
      log(`Mesa ${r.mesa}: pedido rechazado`);
    }
    if (a === "deny") { await Store.updateRequest(id, { status: "cancelled" }); log(`Mesa ${r.mesa}: canje rechazado`); }
    saveToday(); renderSide();
  } catch (e) { console.error(e); toast("No se pudo guardar. Revisa la conexión."); btn.disabled = false; }
}
function renderSide(){
  const pend = {}; list.forEach(r => { if (!pend[r.mesa] || r.type === "bill") pend[r.mesa] = r; });
  $("#tables").innerHTML = Array.from({ length: R.tables }, (_, i) => i + 1).map(n => {
    const r = pend[n]; const cls = r ? r.type : "";
    const txt = !r ? "Libre" : r.type === "call" ? "Llamando" : r.type === "order" ? (r.status === "ready" ? "Llevar pedido" : "Pedido nuevo") : r.type === "redeem" ? "Canje" : r.status === "reported_paid" ? "Verificar SINPE" : r.status === "amount_sent" ? fmt(r.amount) : "Pide cuenta";
    return `<div class="tbl ${cls}"><b>${n}</b><span>${txt}</span></div>`;
  }).join("");
  $("#kpis").innerHTML = `<div class="kpi"><b class="num">${fmt(today.total)}</b><span>Cobrado</span></div><div class="kpi"><b class="num">${today.cobros}</b><span>Cuentas</span></div><div class="kpi"><b class="num">${today.calls}</b><span>Llamadas</span></div>`;
  $("#log").innerHTML = today.log.length ? today.log.map(l => `<div><time>${hm(l.at)}</time><span>${esc(l.t)}</span></div>`).join("") : `<span class="muted">Aquí queda el registro de lo que atiendas hoy.</span>`;
}
setInterval(() => { if (list.length && !(document.activeElement && document.activeElement.id && document.activeElement.id.startsWith("amt-"))) renderQueue(); }, 30000);

Store.init("staff").then(() => Store.onRole(role => role ? start() : showLogin()))
  .catch(e => { console.error(e); $("#app").innerHTML = `<div class="login"><h1>Sin conexión</h1><p class="muted">No se pudo conectar con Firebase. Revisa la configuración en config.js y tu internet.</p></div>`; });
})();
</script>
</body>
</html>
