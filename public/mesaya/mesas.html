<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generador de QR por Mesa · MesaYa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="mesaya.css">
<style>
.wrap{max-width:1140px;margin:0 auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ctl{display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1.4fr) 110px auto;gap:10px;align-items:end;margin:14px 0 22px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
@media (max-width:820px){.ctl{grid-template-columns:minmax(0,1fr)}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.qcard{background:#fff;color:#16241C;border:1px solid #D6DFD7;border-radius:20px;padding:20px 16px 16px;display:grid;justify-items:center;gap:8px;text-align:center;break-inside:avoid;box-shadow:0 6px 20px -10px rgba(0,0,0,.08)}
.qcard .r{font-family:var(--display);font-weight:800;font-size:18px;color:#0F5B3E}
.qcard .m{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;color:#16241C}
.qcard .qr{padding:10px;background:#fff;border:1px solid #E6ECE7;border-radius:14px;display:grid;place-items:center}
.qcard .qr svg,.qcard .qr img{width:156px;height:156px;display:block}
.qcard p{margin:0;font-size:12.5px;color:#5B6B61;max-width:24ch;line-height:1.35}
.qcard code{font-size:10px;color:#8A978F;word-break:break-all;background:#F4F7F4;padding:4px 8px;border-radius:6px;max-width:100%}
.qcard .card-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%;margin-top:4px;padding-top:8px;border-top:1px solid #EBF0EC}
.qcard .mini-btn{border:1px solid #D0DDD3;background:#F6F9F6;color:#0F5B3E;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.qcard .mini-btn:hover{background:#0F5B3E;color:#fff;border-color:#0F5B3E}
.qcard .mini-btn.primary{background:#0F5B3E;color:#fff;border-color:#0F5B3E}
.qcard .mini-btn.primary:hover{opacity:.9}
@media print{
  body{background:#fff}.no-print,.card-actions{display:none!important}
  .wrap{padding:0;max-width:none}.cards{grid-template-columns:repeat(3,1fr);gap:8mm}
  .qcard{border:1px dashed #999;box-shadow:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="no-print">
    <div class="top-nav">
      <div>
        <span class="eyebrow" id="rname"></span>
        <h1 style="font-size:28px;margin-top:2px">Generador de Códigos QR por Mesa</h1>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn line sm" href="index.html">Ver Menú</a>
        <a class="btn line sm" href="salon.html">Panel Salón</a>
        <a class="btn line sm" href="admin.html">Panel Dueño</a>
      </div>
    </div>
    <p class="muted" style="max-width:68ch;margin:0 0 10px">Cada mesa genera su propio código QR con firma de seguridad única (<b>?m=Mesa&amp;k=Clave</b>). Puedes personalizar el nombre del restaurante, probar cualquier mesa con un clic, descargar cada QR en PNG o imprimir todas las tarjetas.</p>
    <div class="ctl">
      <label class="f">Nombre del restaurante<input id="customName" placeholder="Ej. Soda La Ceiba"></label>
      <label class="f">Dirección pública del menú (index.html)<input id="base"></label>
      <label class="f">N.º de Mesas<input id="n" type="number" min="1" max="200" inputmode="numeric"></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn brand" type="button" id="gen">Generar QR</button>
        <button class="btn main" type="button" id="pr">Imprimir todas</button>
      </div>
    </div>
  </div>
  <div class="cards" id="cards"></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="qrcode.js"></script>
<script>
(function(){
  const C = window.MESAYA, R = C.restaurant;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const toastEl = document.getElementById("toast");
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { toastEl.hidden = true; }, 2200);
  }

  document.getElementById("rname").textContent = R.name;
  const customName = document.getElementById("customName");
  const base = document.getElementById("base");
  const n = document.getElementById("n");

  customName.value = R.name;
  const cleanHref = location.href.split("?")[0].split("#")[0];
  base.value = cleanHref.replace(/mesas(\.html)?$/i, "index.html");
  if (!base.value.endsWith("index.html")) {
    base.value = location.origin + "/mesaya/index.html";
  }
  n.value = R.tables || 12;

  function downloadQrPng(mesa, restName, url) {
    const q = qrcode(0, "M");
    q.addData(url);
    q.make();
    const count = q.getModuleCount();
    const scale = 10;
    const qrSize = count * scale;
    const pad = 40;
    const w = qrSize + pad * 2;
    const h = qrSize + pad * 2 + 110;

    const canvas = document.createElement("canvas");
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = "#0F5B3E";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(restName, w / 2, 36);

    ctx.fillStyle = "#16241C";
    ctx.font = "bold 34px sans-serif";
    ctx.fillText("Mesa " + mesa, w / 2, 74);

    const offsetY = 92;
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        ctx.fillStyle = q.isDark(r, c) ? "#000000" : "#FFFFFF";
        ctx.fillRect(pad + c * scale, offsetY + r * scale, scale, scale);
      }
    }

    ctx.fillStyle = "#5B6B61";
    ctx.font = "13px sans-serif";
    ctx.fillText("Escanea para ver el menú y pedir", w / 2, offsetY + qrSize + 28);

    const a = document.createElement("a");
    a.download = "QR-Mesa-" + mesa + "-" + restName.replace(/\s+/g, "-") + ".png";
    a.href = canvas.toDataURL("image/png");
    a.click();
    toast("QR de Mesa " + mesa + " descargado en PNG");
  }

  function gen(){
    const box = document.getElementById("cards");
    box.innerHTML = "";
    const restTitle = (customName.value || R.name).trim();
    document.getElementById("rname").textContent = restTitle;
    const total = Math.min(200, Math.max(1, parseInt(n.value, 10) || R.tables));
    const baseUrl = (base.value || "").trim() || (location.origin + "/mesaya/index.html");

    for (let m = 1; m <= total; m++) {
      const key = Store.tableKey(m);
      const url = baseUrl + "?m=" + m + "&k=" + key;
      const c = document.createElement("div");
      c.className = "qcard";

      const q = qrcode(0, "M");
      q.addData(url);
      q.make();
      const svgMarkup = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });

      c.innerHTML = `
        <span class="r">${esc(restTitle)}</span>
        <span class="m">Mesa ${m}</span>
        <div class="qr">${svgMarkup}</div>
        <p>Escanea para ver el menú, llamar al mesero, pagar con SINPE y ganar puntos</p>
        <code>Mesa ${m} · Clave: ${esc(key)}</code>
        <div class="card-actions no-print">
          <a class="mini-btn primary" href="index.html?m=${m}&k=${encodeURIComponent(key)}" target="_blank" rel="noopener">Probar Mesa ${m}</a>
          <button class="mini-btn" type="button" data-dl="${m}">Descargar PNG</button>
          <button class="mini-btn" type="button" data-copy="${esc(url)}">Copiar link</button>
        </div>
      `;
      box.appendChild(c);

      const dlBtn = c.querySelector("[data-dl]");
      if (dlBtn) dlBtn.onclick = () => downloadQrPng(m, restTitle, url);

      const cpBtn = c.querySelector("[data-copy]");
      if (cpBtn) cpBtn.onclick = () => {
        try {
          navigator.clipboard.writeText(url).then(() => toast("Enlace de Mesa " + m + " copiado"));
        } catch (e) {
          toast(url);
        }
      };
    }
  }

  document.getElementById("gen").onclick = gen;
  customName.oninput = gen;
  n.onchange = gen;
  base.onchange = gen;
  document.getElementById("pr").onclick = () => window.print();
  gen();
})();
</script>
</body>
</html>
