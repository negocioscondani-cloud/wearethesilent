<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel del dueño</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="mesaya.css">
<style>
/* Layout: escritorio — pestañas Resumen / Inventario / Menú; resumen arriba con indicadores y luego gráficos en dos columnas */
.wrap{max-width:1200px;margin:0 auto;padding-block:calc(14px + env(safe-area-inset-top,0px)) 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:26px}
.nav{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.nav button{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.nav button[aria-current="page"]{color:var(--fg);border-color:var(--mango)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--chip);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{font-family:var(--display);font-size:26px;display:block;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi small{display:block;margin-top:4px;font-size:12px;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
.box.full{grid-column:1/-1}
.box h2{font-size:17px}
.box .sub{font-size:12.5px;color:var(--muted);margin-top:-8px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--body)}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.hb .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:12px;border-radius:6px;background:var(--chip);overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:6px;background:var(--brand)}
.hb .val{font-variant-numeric:tabular-nums;font-weight:600;min-width:52px;text-align:right}
.fb{display:grid;gap:8px;max-height:320px;overflow-y:auto}
.fb .r{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:3px;font-size:14px}
.fb .stars{color:var(--mango);letter-spacing:2px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.low td:first-child{box-shadow:inset 4px 0 0 var(--alert)}
.mv{display:flex;gap:6px;align-items:center}
.mv input{width:76px;padding:7px 8px;border-radius:9px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.moves{display:grid;gap:6px;font-size:13.5px;max-height:300px;overflow-y:auto}
.moves .r{display:grid;grid-template-columns:minmax(0,1fr) 70px 150px;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:7px 0}
.moves .r>span:nth-child(2),.moves .r>span:nth-child(3){text-align:right}
.dish-row{display:grid;grid-template-columns:56px minmax(0,1fr) 130px auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dish-row .ph{width:56px;height:56px;border-radius:12px;position:relative;overflow:hidden;cursor:pointer;border:1px solid var(--line)}
.dish-row .ph span{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-weight:700;text-align:center;padding:2px 0}
.dish-row .amt{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dish-row .amt span{padding:0 8px;color:var(--muted);font-weight:700}
.dish-row .amt input{border:0;border-radius:0;padding:8px 8px 8px 0;font-variant-numeric:tabular-nums}
@media (max-width:680px){.dish-row{grid-template-columns:56px minmax(0,1fr);}.dish-row .amt,.dish-row .sw,.dish-row .del-d{grid-column:2}}
.add-dish-box{background:var(--surface);border:2px solid var(--brand);border-radius:18px;padding:18px;margin-bottom:18px;display:grid;gap:14px}
.add-dish-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
.photo-picker{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2)}
.photo-preview{width:64px;height:64px;border-radius:12px;background-size:cover;background-position:center;border:1px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;cursor:pointer}
.sw input{width:40px;height:22px;appearance:none;border-radius:999px;background:var(--line);position:relative;cursor:pointer;padding:0;border:0;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked{background:var(--alert)}
.sw input:checked::after{left:21px}
.save-bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.login{max-width:410px;margin:8vh auto 0;display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.login h1{font-size:28px}
.or-sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em}
.or-sep::before,.or-sep::after{content:"";flex:1;height:1px;background:var(--line)}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1F1F1F;border:1px solid #DADCE0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;width:100%}
.btn-google:hover{background:#F8FAFD}
.demo-tip{font-size:13px;border:1px dashed var(--mango);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.demo-tip a{color:var(--brand);font-weight:700}
.err{color:var(--alert);margin:0;font-size:14px;font-weight:600}
.note{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="store.js"></script>
<script>
(function(){
const C = window.MESAYA, R = C.restaurant;
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const fmt = n => "₡" + Math.round(n || 0).toLocaleString("es-CR");
const fmtK = n => n >= 1e6 ? "₡" + (+(n / 1e6).toFixed(1)) + "M" : n >= 1000 ? "₡" + Math.round(n / 1000) + "k" : "₡" + Math.round(n);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0; };
function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 2400); }

let tab = "resumen", range = "today", started = false, inv = null, pub = null, cache = {};

function compressImageFile(file, maxSize = 620, quality = 0.78) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer la imagen"));
    reader.onload = (ev) => {
      const img = new Image();
      img.onerror = () => reject(new Error("Formato de imagen inválido"));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxSize || h > maxSize) {
          if (w > h) { h = Math.round((h * maxSize) / w); w = maxSize; }
          else { w = Math.round((w * maxSize) / h); h = maxSize; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- acceso (Google o Correo y Contraseña) ---------- */
function showLogin(err){
  const demo = Store.mode() === "demo";
  const gIcon = `<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`;
  $("#app").innerHTML = `<form class="login" id="lf">
    <div><span class="eyebrow">${esc(R.name)}</span><h1>Panel del dueño</h1></div>
    ${demo ? "" : `<button class="btn-google" type="button" id="gbtn">${gIcon}<span>Continuar con Google</span></button><div class="or-sep">o con correo y contraseña</div>`}
    ${demo ? "" : `<label class="f">Correo electrónico<input id="le" type="email" autocomplete="username" placeholder="dueno@restaurante.com" required></label>`}
    <label class="f">${demo ? "PIN" : "Contraseña"}<input id="lp" type="password" ${demo ? "" : 'placeholder="Mínimo 6 caracteres"'} autocomplete="current-password" required></label>
    ${err ? `<p class="err">${esc(err)}</p>` : ""}
    <div style="display:grid;gap:8px">
      <button class="btn brand block" type="submit">Entrar con correo</button>
      ${demo ? "" : `<button class="btn line block" type="button" id="regbtn">Crear cuenta nueva con este correo</button>`}
    </div>
    <div class="demo-tip">
      <b>Accesos directos conectados (Firestore en vivo):</b>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px">
        <a href="/mesaya">🏠 Home Vendedor</a>
        <a href="index.html?m=7&k=${Store.tableKey(7)}" target="_blank" rel="noopener">📱 Menú Mesa 7</a>
        <a href="salon.html">🛎️ Salón</a>
        <a href="cocina.html">👨‍🍳 Cocina</a>
        <a href="mesas.html">🖨️ QR Mesas</a>
      </div>
    </div>
  </form>`;
  if ($("#gbtn")) {
    $("#gbtn").onclick = async () => {
      try { await Store.loginWithGoogle("owner"); start(); }
      catch (x) { showLogin(Store.humanAuthError(x)); }
    };
  }
  if ($("#regbtn")) {
    $("#regbtn").onclick = async () => {
      const email = ($("#le").value || "").trim(), pass = $("#lp").value || "";
      if (!email || !pass) { showLogin("Escribe tu correo y una contraseña de al menos 6 caracteres para crear la cuenta."); return; }
      try { await Store.register("owner", email, pass); toast("Cuenta creada y conectada"); start(); }
      catch (x) { showLogin(Store.humanAuthError(x)); }
    };
  }
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    try { await Store.login("owner", demo ? "" : $("#le").value.trim(), $("#lp").value); start(); }
    catch (x) { showLogin(Store.humanAuthError(x)); }
  };
}
function start(){
  if (started) return; started = true;
  const u = Store.user();
  $("#app").innerHTML = `<div class="top"><div><span class="eyebrow">${esc(R.name)}${u && u.email ? " · " + esc(u.email) : ""}</span><h1>Panel del dueño</h1></div>
    <div class="row">
      <span class="chip ok">${Store.mode() === "demo" ? "Modo demo" : "Firestore en vivo"}</span>
      <a class="btn line sm" href="/mesaya">🏠 Home Vendedor</a>
      <a class="btn line sm" href="index.html?m=7&k=${Store.tableKey(7)}" target="_blank" rel="noopener">Menú Mesa 7</a>
      <a class="btn line sm" href="salon.html">Panel del salón</a>
      <a class="btn line sm" href="cocina.html">Cocina</a>
      <a class="btn line sm" href="mesas.html">QR de mesas</a>
      <button class="btn ghost sm" id="out">Salir</button>
    </div></div>
    <nav class="nav" aria-label="Secciones"><button data-t="resumen">Estadísticas (Resumen)</button><button data-t="menu">Menú, Productos y Fotos</button><button data-t="clientes">Clientes y Puntos</button><button data-t="inventario">Inventario</button></nav>
    <div id="view"></div>`;
  $$(".nav button").forEach(b => b.onclick = () => { tab = b.dataset.t; show(); });
  $("#out").onclick = async () => { started = false; await Store.logout(); showLogin(); };
  show();
}
function show(){ $$(".nav button").forEach(b => { if (b.dataset.t === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }); ({ resumen: vResumen, inventario: vInventario, menu: vMenu, clientes: vClientes })[tab](); }

/* ---------- Clientes y Club de Puntos (CRM) ---------- */
async function vClientes(){
  const v = $("#view");
  v.innerHTML = `<p class="muted">Cargando clientes del Club de Puntos…</p>`;
  let custs = [];
  try { custs = await Store.listCustomers(); } catch (e) { console.error(e); }
  const totalPts = custs.reduce((a, c) => a + (c.points || 0), 0);
  const withEmail = custs.filter(c => c.email).length;

  v.innerHTML = `
  <div class="kpis" style="margin-top:0">
    <div class="kpi"><b class="num">${custs.length}</b><span>Clientes registrados</span></div>
    <div class="kpi"><b class="num">${withEmail}</b><span>Con correo verificado</span></div>
    <div class="kpi"><b class="num">${totalPts}</b><span>Puntos activos en el club</span></div>
  </div>
  <section class="box full">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div>
        <h2>Base de datos de clientes y puntos</h2>
        <p class="sub" style="margin:2px 0 0">Se registran desde el Menú QR con Google o con su correo y teléfono.</p>
      </div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Correo electrónico</th>
            <th>Teléfono</th>
            <th>Cumpleaños</th>
            <th class="n">Visitas</th>
            <th class="n">Puntos</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          ${custs.map(c => {
            const shownPhone = c.displayPhone || (String(c.phone || "").startsWith("g_") ? "—" : c.phone);
            return `<tr>
              <td><b>${esc(c.name || "Cliente")}</b> ${c.provider === "google" ? '<span class="chip" style="font-size:10px">Google</span>' : ""}</td>
              <td>${c.email ? esc(c.email) : '<span class="muted">Sin correo</span>'}</td>
              <td class="num">${esc(shownPhone)}</td>
              <td class="num">${c.birthday ? esc(c.birthday) : "—"}</td>
              <td class="n">${c.visits || 0}</td>
              <td class="n"><b style="color:var(--brand);font-size:16px">${c.points || 0} pts</b></td>
              <td>
                <div class="mv">
                  <button class="btn brand sm" type="button" data-gift="${esc(c.phone)}" title="Regalar +10 puntos">+10 pts</button>
                  ${c.email ? `<button class="btn line sm" type="button" data-mail="${esc(c.phone)}" title="Enviar correo de confirmación y puntos">📩 Enviar correo</button>` : ""}
                </div>
              </td>
            </tr>`;
          }).join("") || `<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">Todavía no hay clientes registrados. Regístrate en el Menú del Cliente (sección Puntos o Perfil) con Google o correo para verlo aparecer aquí en tiempo real.</td></tr>`}
        </tbody>
      </table>
    </div>
  </section>`;

  $$("[data-gift]").forEach(btn => {
    btn.onclick = async () => {
      const key = btn.dataset.gift;
      btn.disabled = true;
      await Store.addPoints(key, 10, { type: "visit", date: Date.now(), amount: 0, pts: 10, reward: "Bono de cortesía" });
      toast("+10 puntos acreditados al cliente");
      vClientes();
    };
  });

  $$("[data-mail]").forEach(btn => {
    btn.onclick = async () => {
      const key = btn.dataset.mail;
      const c = custs.find(x => x.phone === key);
      if (!c || !c.email) return;
      btn.disabled = true;
      btn.textContent = "Enviando…";
      await Store.sendWelcomeEmail(c);
      toast("Correo de confirmación y puntos enviado a " + c.email);
      btn.disabled = false;
      btn.textContent = "📩 Enviar correo";
    };
  });
}

/* ---------- gráficos SVG ---------- */
function niceScale(v){ if (v <= 0) return { max: 4, ticks: 4 }; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  if (f <= 1) return { max: p, ticks: 4 }; if (f <= 2) return { max: 2 * p, ticks: 4 }; if (f <= 3) return { max: 3 * p, ticks: 3 }; if (f <= 4) return { max: 4 * p, ticks: 4 }; if (f <= 5) return { max: 5 * p, ticks: 5 }; if (f <= 6) return { max: 6 * p, ticks: 3 }; if (f <= 8) return { max: 8 * p, ticks: 4 }; return { max: 10 * p, ticks: 5 }; }
function barChart(vals, labels, opts){
  const W = Math.max(520, vals.length * 26), H = 230, L = 52, Rm = 10, T = 14, B = 30, iw = W - L - Rm, ih = H - T - B;
  const sc = niceScale(Math.max(...vals, 0)), max = sc.max, bw = iw / vals.length, step = opts.every || 1;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.title)}">`;
  for (let i = 0; i <= sc.ticks; i++) { const v = max * i / sc.ticks, y = T + ih - ih * i / sc.ticks;
    s += `<line x1="${L}" x2="${W - Rm}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${y + 4}" font-size="11" text-anchor="end">${opts.fmt(v)}</text>`; }
  vals.forEach((v, i) => { const h = ih * v / max, x = L + i * bw + bw * 0.16, w = bw * 0.68, hi = opts.hi === i && v > 0;
    s += `<rect x="${x.toFixed(1)}" y="${(T + ih - h).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h, v ? 1 : 0).toFixed(1)}" rx="3" fill="${hi ? "var(--mango)" : "var(--brand)"}"><title>${esc(labels[i])}: ${opts.fmt(v, true)}</title></rect>`;
    if (i % step === 0) s += `<text x="${(L + i * bw + bw / 2).toFixed(1)}" y="${H - 10}" font-size="11" text-anchor="middle">${esc(labels[i])}</text>`; });
  return s + `</svg>`;
}
function hbars(rows, f, color){
  const max = Math.max(...rows.map(r => r[1]), 1);
  return `<div class="hbars">${rows.map(([l, v, c]) => `<div class="hb"><span class="lbl" title="${esc(l)}">${esc(l)}</span><span class="track"><i style="width:${(v / max * 100).toFixed(1)}%${c || color ? ";background:" + (c || color) : ""}"></i></span><span class="val">${f(v)}</span></div>`).join("")}</div>`;
}

/* ---------- Resumen / analítica (Hoy, Ayer, 7 días, 1 mes, 1 año — iniciando en 0) ---------- */
async function vResumen(){
  const v = $("#view");
  const periods = [
    { id: "today", label: "Hoy" },
    { id: "yesterday", label: "Ayer" },
    { id: 7, label: "7 días" },
    { id: 30, label: "1 mes" },
    { id: 365, label: "1 año" }
  ];
  v.innerHTML = `<div class="row" style="justify-content:space-between;gap:10px">
    <div class="seg" role="group" aria-label="Periodo" style="flex-wrap:wrap">
      ${periods.map(p => `<button data-r="${p.id}" aria-pressed="${String(range) === String(p.id)}">${p.label}</button>`).join("")}
    </div>
    <div class="row">
      <button class="btn line sm" id="btnZero" type="button" title="Dejar todos los contadores en 0 para nueva demostración">🔄 Reiniciar contadores a cero</button>
    </div>
  </div><div id="res"><p class="muted">Cargando estadísticas…</p></div>`;

  $$("[data-r]").forEach(b => b.onclick = () => {
    const val = b.dataset.r;
    range = (val === "today" || val === "yesterday") ? val : +val;
    vResumen();
  });

  $("#btnZero").onclick = async () => {
    if (!$("#btnZero").dataset.sure) {
      $("#btnZero").dataset.sure = "1";
      $("#btnZero").textContent = "¿Confirmar poner todo en 0?";
      setTimeout(() => { if ($("#btnZero")) { delete $("#btnZero").dataset.sure; $("#btnZero").textContent = "🔄 Reiniciar contadores a cero"; } }, 3000);
      return;
    }
    await Store.resetStatsToZero();
    cache = {};
    toast("Contadores reiniciados en 0");
    vResumen();
  };

  await Store.getPublic();

  const todayKey = Store.dayKey(Date.now());
  const yesterdayKey = Store.dayKey(Date.now() - 86400000);
  let numDays = 1, fromKey = todayKey, sinceMs = Date.now() - 86400000;
  if (range === "today") { numDays = 1; fromKey = todayKey; sinceMs = new Date().setHours(0, 0, 0, 0); }
  else if (range === "yesterday") { numDays = 1; fromKey = yesterdayKey; sinceMs = new Date().setHours(0, 0, 0, 0) - 86400000; }
  else { numDays = Number(range) || 30; fromKey = Store.dayKey(Date.now() - (numDays - 1) * 86400000); sinceMs = Date.now() - numDays * 86400000; }

  let allStats = [], fb = [];
  try {
    allStats = await Store.getStats(fromKey);
    fb = await Store.getFeedback(sinceMs);
  } catch (e) { console.error(e); }

  let stats = allStats;
  if (range === "today") stats = allStats.filter(s => s.day === todayKey);
  else if (range === "yesterday") stats = allStats.filter(s => s.day === yesterdayKey);

  const sum = (k) => stats.reduce((a, s) => a + (s[k] || 0), 0);
  const merge = k => { const o = {}; stats.forEach(s => Object.entries(s[k] || {}).forEach(([a, n]) => o[a] = (o[a] || 0) + n)); return o; };
  const sales = sum("sales"), bills = sum("bills"), members = sum("members"), calls = sum("calls"), redeems = sum("redeems"), pts = sum("points");
  const ratings = fb.filter(f => f.rating), avg = ratings.length ? ratings.reduce((a, f) => a + f.rating, 0) / ratings.length : 0;

  const byDay = {};
  stats.forEach(s => byDay[s.day] = s.sales || 0);

  let chartVals = [], chartLabels = [], chartTitle = "Ventas del periodo", chartSub = "", chartEvery = 1;
  const hourLbl = h => (h % 12 || 12) + (h < 12 ? "am" : "pm");
  const byHour = merge("byHour"), hours = [];
  for (let h = 6; h <= 22; h++) hours.push(h);
  const hourVals = hours.map(h => byHour[h] || 0);
  const maxHourVal = Math.max(...hourVals, 0);
  const peak = maxHourVal > 0 ? hourVals.indexOf(maxHourVal) : 0;

  if (range === "today" || range === "yesterday") {
    const lblDay = range === "today" ? "Hoy" : "Ayer";
    chartVals = hourVals;
    chartLabels = hours.map(hourLbl);
    chartTitle = `Ventas por hora (${lblDay})`;
    chartSub = sales > 0 ? `Total ${lblDay.toLowerCase()}: ${fmt(sales)}` : `Total ${lblDay.toLowerCase()}: ₡0 · Listo para registrar pedidos en vivo`;
    chartEvery = 2;
  } else if (range === 365) {
    const monthNames = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
    const nowD = new Date();
    const mMap = {};
    for (let i = 11; i >= 0; i--) {
      const d = new Date(nowD.getFullYear(), nowD.getMonth() - i, 1);
      const ym = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      mMap[ym] = { label: monthNames[d.getMonth()], val: 0 };
    }
    stats.forEach(s => {
      const ym = (s.day || "").slice(0, 7);
      if (mMap[ym]) mMap[ym].val += (s.sales || 0);
    });
    chartVals = Object.values(mMap).map(x => x.val);
    chartLabels = Object.values(mMap).map(x => x.label);
    chartTitle = "Ventas por mes (Último año)";
    const maxM = Math.max(...chartVals, 0);
    const bestM = maxM > 0 ? chartVals.indexOf(maxM) : 0;
    chartSub = maxM > 0 ? `Mejor mes: ${chartLabels[bestM]} con ${fmt(chartVals[bestM])}` : "Acumulado anual en ₡0 · Listo para registrar ventas";
    chartEvery = 1;
  } else {
    const days = [];
    for (let i = numDays - 1; i >= 0; i--) {
      days.push(Store.dayKey(Date.now() - i * 86400000));
    }
    chartVals = days.map(k => byDay[k] || 0);
    chartLabels = days.map(k => { const [y, m, d] = k.split("-"); return d + "/" + m; });
    const maxD = Math.max(...chartVals, 0);
    const bestD = maxD > 0 ? chartVals.indexOf(maxD) : 0;
    chartTitle = `Ventas por día (${numDays === 7 ? "Últimos 7 días" : "Último mes"})`;
    chartSub = maxD > 0 ? `Mejor día: ${chartLabels[bestD]} con ${fmt(chartVals[bestD])}` : "Total en ₡0 · Se actualiza en vivo cuando el salón confirma cobros";
    chartEvery = numDays > 14 ? 3 : 1;
  }

  const bestIdx = Math.max(...chartVals, 0) > 0 ? chartVals.indexOf(Math.max(...chartVals)) : -1;
  const methods = merge("byMethod"), mTot = Object.values(methods).reduce((a, b) => a + b, 0) || 1;
  const views = merge("views"), topViews = Object.entries(views).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([id, n]) => [(C.menu.find(m => m.id === id) || { name: id }).name, n]);
  const sold = merge("sold"), topSold = Object.entries(sold).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([id, n]) => [(C.menu.find(m => m.id === id) || { name: id }).name, n]);
  const orders = sum("orders");
  const tables = merge("tables"), topTables = Object.entries(tables).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([t, n]) => ["Mesa " + t, n]);

  $("#res").innerHTML = `
  <div class="kpis">
    <div class="kpi"><b class="num">${fmt(sales)}</b><span>Ventas por la app</span></div>
    <div class="kpi"><b class="num">${bills}</b><span>Cuentas cobradas</span></div>
    <div class="kpi"><b class="num">${fmt(bills ? sales / bills : 0)}</b><span>Ticket promedio</span></div>
    <div class="kpi"><b class="num">${bills ? Math.round(members / bills * 100) : 0}%</b><span>Cuentas con cliente del club</span></div>
    <div class="kpi"><b class="num">${avg ? avg.toFixed(1) : "0.0"}<span style="font-size:15px;color:var(--mango)"> ★</span></b><span>${ratings.length} calificaciones</span></div>
    <div class="kpi"><b class="num">${calls}</b><span>Llamadas al mesero · ${redeems} canjes</span></div>
  </div>
  <div class="cols">
    <section class="box full"><h2>${esc(chartTitle)}</h2><p class="sub">${esc(chartSub)}</p><div class="chart">${barChart(chartVals, chartLabels, { title: chartTitle, fmt: (v, full) => full ? fmt(v) : fmtK(v), every: chartEvery, hi: bestIdx })}</div></section>
    <section class="box"><h2>Horas pico</h2><p class="sub">${maxHourVal > 0 ? `Más ventas a las ${hourLbl(hours[peak])}.` : "En 0 · Muestra las horas con mayor movimiento del restaurante."}</p><div class="chart">${barChart(hourVals, hours.map(hourLbl), { title: "Ventas por hora", fmt: (v, full) => full ? fmt(v) : fmtK(v), every: 2, hi: maxHourVal > 0 ? peak : -1 })}</div></section>
    <section class="box"><h2>Métodos de pago</h2><p class="sub">Porcentaje de lo vendido</p>${hbars([["SINPE Móvil", methods.sinpe || 0, "var(--brand)"], ["Tarjeta", methods.tarjeta || 0, "var(--mango)"], ["Efectivo", methods.efectivo || 0, "var(--muted)"]], v => (sales > 0 ? Math.round(v / mTot * 100) : 0) + "%")}
      <p class="note" style="margin:0">SINPE no paga comisión; la tarjeta sí. Cada punto que pasa de tarjeta a SINPE es margen.</p></section>
    <section class="box"><h2>Platos más vendidos</h2><p class="sub">Unidades pedidas por la app · ${orders} pedidos</p>${topSold.length ? hbars(topSold, v => v, "var(--mango)") : `<p class="muted">En 0 · Aparecen conforme los clientes piden desde el menú.</p>`}</section>
    <section class="box"><h2>Platos más vistos</h2><p class="sub">Veces que abrieron el plato en el menú</p>${topViews.length ? hbars(topViews, v => v) : `<p class="muted">En 0 · Se suman cuando los clientes tocan los platos.</p>`}</section>
    <section class="box"><h2>Mesas que más venden</h2><p class="sub">Total cobrado por mesa</p>${topTables.length ? hbars(topTables, fmtK) : `<p class="muted">En 0 · Se actualiza al confirmar cobros en Salón.</p>`}</section>
    <section class="box"><h2>Club de puntos</h2><div class="kpis" style="margin:0;grid-template-columns:1fr 1fr"><div class="kpi"><b class="num">${pts}</b><span>Puntos entregados</span></div><div class="kpi"><b class="num">${redeems}</b><span>Canjes</span></div></div>
      <p class="note" style="margin:0">Cada cliente del club deja su teléfono: es tu base para promociones y cumpleaños.</p></section>
    <section class="box"><h2>Comentarios de clientes</h2><p class="sub">Las calificaciones de 1 a 3 llegan solo aquí, no a Google</p>
      <div class="fb">${fb.filter(f => f.rating < 4 || f.text).slice(0, 30).map(f => `<div class="r"><span class="stars">${"★".repeat(f.rating)}<span style="color:var(--line)">${"★".repeat(5 - f.rating)}</span></span><span>${f.text ? esc(f.text) : '<span class="muted">Sin comentario</span>'}</span><span class="note">Mesa ${f.mesa} · ${new Date(f.at).toLocaleDateString("es-CR", { day: "numeric", month: "short" })}</span></div>`).join("") || `<p class="muted">Sin comentarios en este periodo.</p>`}</div></section>
  </div>`;
}

/* ---------- Inventario ---------- */
async function vInventario(){
  const v = $("#view"); v.innerHTML = `<p class="muted">Cargando inventario…</p>`;
  try { if (!inv) inv = (await Store.getInventory()) || { items: [], moves: [] }; } catch (e) { v.innerHTML = `<p class="err">No se pudo cargar el inventario.</p>`; return; }
  inv.items = inv.items || []; inv.moves = inv.moves || [];
  const low = inv.items.filter(i => i.stock <= i.min), value = inv.items.reduce((a, i) => a + i.stock * (i.cost || 0), 0);
  v.innerHTML = `
  <div class="kpis" style="margin-top:0">
    <div class="kpi"><b class="num">${inv.items.length}</b><span>Insumos registrados</span></div>
    <div class="kpi"><b class="num" style="color:${low.length ? "var(--alert)" : "var(--ok)"}">${low.length}</b><span>Por debajo del mínimo</span></div>
    <div class="kpi"><b class="num">${fmt(value)}</b><span>Valor del inventario</span></div>
  </div>
  ${low.length ? `<div class="box" style="margin-bottom:14px;border-color:var(--alert)"><h2>Hay que comprar</h2><p style="margin:0">${low.map(i => `<b>${esc(i.name)}</b> (quedan ${i.stock} ${esc(i.unit)}, mínimo ${i.min})`).join(" · ")}</p></div>` : ""}
  <section class="box full">
    <h2>Insumos</h2>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Insumo</th><th class="n">Stock</th><th class="n">Mínimo</th><th>Unidad</th><th class="n">Costo unit.</th><th class="n">Valor</th><th>Estado</th><th>Registrar movimiento</th><th></th></tr></thead>
      <tbody>${inv.items.map(i => `<tr class="${i.stock <= i.min ? "low" : ""}">
        <td><b>${esc(i.name)}</b></td><td class="n">${i.stock}</td><td class="n">${i.min}</td><td>${esc(i.unit)}</td><td class="n">${fmt(i.cost)}</td><td class="n">${fmt(i.stock * (i.cost || 0))}</td>
        <td>${i.stock <= i.min ? '<span class="chip alert">Bajo</span>' : '<span class="chip ok">OK</span>'}</td>
        <td><div class="mv"><input id="q-${i.id}" inputmode="decimal" placeholder="Cant." aria-label="Cantidad de ${esc(i.name)}"><button class="btn brand sm" data-in="${i.id}" title="Entrada">+ Entrada</button><button class="btn ghost sm" data-out="${i.id}" title="Salida">− Salida</button></div></td>
        <td><button class="btn ghost sm" data-del="${i.id}" aria-label="Eliminar ${esc(i.name)}">Eliminar</button></td></tr>`).join("") || `<tr><td colspan="9" class="muted">Agrega tu primer insumo abajo.</td></tr>`}</tbody>
    </table></div>
    <form id="addF" class="form-grid" novalidate>
      <label class="f">Nuevo insumo<input id="nName" placeholder="Ej. Plátano maduro" required></label>
      <label class="f">Unidad<input id="nUnit" placeholder="kg, unid, litro" value="kg"></label>
      <label class="f">Stock actual<input id="nStock" inputmode="decimal" value="0"></label>
      <label class="f">Mínimo<input id="nMin" inputmode="decimal" value="0"></label>
      <label class="f">Costo unitario ₡<input id="nCost" inputmode="numeric" value="0"></label>
      <button class="btn main" type="submit">Agregar insumo</button>
    </form>
  </section>
  <section class="box full" style="margin-top:14px"><h2>Últimos movimientos</h2>
    <div class="moves">${inv.moves.slice(0, 40).map(m => `<div class="r"><span>${m.type === "in" ? "Entrada" : "Salida"} · <b>${esc(m.name)}</b>${m.note ? " · " + esc(m.note) : ""}</span><span class="num" style="color:${m.qty < 0 ? "var(--alert)" : "var(--ok)"};font-weight:700">${m.qty > 0 ? "+" : ""}${m.qty}</span><span class="note num">${new Date(m.at).toLocaleString("es-CR", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" })}</span></div>`).join("") || `<p class="muted">Sin movimientos.</p>`}</div>
    <p class="note" style="margin:0">Todo el inventario vive en un solo documento: 1 lectura al abrir esta pestaña y 1 escritura por cambio.</p></section>`;
  const save = async (msg) => { try { await Store.saveInventory(inv); toast(msg); vInventario(); } catch (e) { console.error(e); toast("No se pudo guardar"); } };
  const move = (id, sign) => {
    const it = inv.items.find(i => i.id === id), q = Math.abs(num($("#q-" + id).value));
    if (!q) { toast("Escribe la cantidad"); $("#q-" + id).focus(); return; }
    it.stock = Math.max(0, Math.round((it.stock + sign * q) * 100) / 100);
    inv.moves.unshift({ at: Date.now(), itemId: id, name: it.name, qty: sign * q, type: sign > 0 ? "in" : "out", note: "" }); inv.moves = inv.moves.slice(0, 200);
    save((sign > 0 ? "Entrada" : "Salida") + " registrada: " + it.name);
  };
  $$("[data-in]").forEach(b => b.onclick = () => move(b.dataset.in, 1));
  $$("[data-out]").forEach(b => b.onclick = () => move(b.dataset.out, -1));
  $$("[data-del]").forEach(b => b.onclick = () => {
    if (b.dataset.sure) { inv.items = inv.items.filter(i => i.id !== b.dataset.del); save("Insumo eliminado"); }
    else { b.dataset.sure = 1; b.textContent = "¿Seguro?"; b.className = "btn danger sm"; setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = "Eliminar"; b.className = "btn ghost sm"; } }, 3000); }
  });
  $("#addF").onsubmit = e => {
    e.preventDefault(); const name = $("#nName").value.trim(); if (!name) { toast("Escribe el nombre del insumo"); return; }
    inv.items.push({ id: "i" + Date.now().toString(36), name, unit: $("#nUnit").value.trim() || "unid", stock: num($("#nStock").value), min: num($("#nMin").value), cost: Math.round(num($("#nCost").value)) });
    save("Insumo agregado: " + name);
  };
}

  photoInput.onchange = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file || !photoTargetId) return;
    try {
      const dataUrl = await compressImageFile(file);
      draft.customImages[photoTargetId] = dataUrl;
      pub = await Store.setPublic({
        soldOut: Array.from(draft.soldOut),
        prices: draft.prices,
        customDishes: draft.customDishes,
        deletedDishes: Array.from(draft.deletedDishes),
        customImages: draft.customImages
      });
      toast("Fotografía actualizada");
      vMenu();
    } catch (err) { toast("No se pudo cambiar la foto"); }
  };

  // Eliminar plato
  $$("[data-del-dish]").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.delDish;
      if (!btn.dataset.sure) {
        btn.dataset.sure = "1";
        btn.textContent = "¿Confirmar?";
        btn.className = "btn danger sm del-d";
        setTimeout(() => { if (btn.isConnected) { delete btn.dataset.sure; btn.textContent = "Eliminar"; btn.className = "btn ghost sm del-d"; } }, 3000);
        return;
      }
      draft.deletedDishes.add(id);
      draft.customDishes = draft.customDishes.filter(d => d.id !== id);
      pub = await Store.setPublic({
        soldOut: Array.from(draft.soldOut),
        prices: draft.prices,
        customDishes: draft.customDishes,
        deletedDishes: Array.from(draft.deletedDishes),
        customImages: draft.customImages
      });
      toast("Producto eliminado del menú");
      vMenu();
    };
  });

  $("#reset").onclick = () => $$("input[id^=s-]").forEach(i => i.checked = false);
  $("#savePub").onclick = async () => {
    const outSold = [], outPrices = {};
    C.menu.forEach(m => {
      const sEl = $("#s-" + m.id), pEl = $("#p-" + m.id);
      if (sEl && sEl.checked) outSold.push(m.id);
      if (pEl) {
        const p = Math.round(num(pEl.value));
        if (p && p !== m.price) outPrices[m.id] = p;
      }
    });
    $("#savePub").disabled = true;
    try {
      pub = await Store.setPublic({
        soldOut: outSold,
        prices: outPrices,
        customDishes: draft.customDishes,
        deletedDishes: Array.from(draft.deletedDishes),
        customImages: draft.customImages
      });
      toast("Menú actualizado en vivo");
    } catch (e) { console.error(e); toast("No se pudo guardar"); }
    $("#savePub").disabled = false;
  };
}

Store.init("owner").then(() => Store.onRole(role => role === "owner" ? start() : showLogin(role === "staff" ? "Este usuario es del salón, no del dueño." : null)))
  .catch(e => { console.error(e); $("#app").innerHTML = `<div class="login"><h1>Sin conexión</h1><p class="muted">No se pudo conectar con Firebase. Revisa config.js y tu internet.</p></div>`; });
})();
</script>
</body>
</html>
